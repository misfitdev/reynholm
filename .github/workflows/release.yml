name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release archives
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt

      - name: Get container digest
        id: digest
        run: |
          digest=$(jq -r '.[] | select(.type=="Docker Image") | select(.name | contains("amd64")) | .extra.Digest' dist/artifacts.json | head -1)
          echo "value=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest container image
        if: steps.digest.outputs.value != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/misfitdev/reynholm
          subject-digest: ${{ steps.digest.outputs.value }}
          push-to-registry: true

  sbom:
    needs: release
    permissions:
      contents: write
    uses: misfitdev/.github/.github/workflows/sbom.yml@main
    with:
      attach-to-release: true
